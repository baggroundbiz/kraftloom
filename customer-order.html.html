<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Custom Order | Kraftloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- (Include Header, Toast, Cart) -->
  
  <main class="container" style="max-width: 700px;">
    <h1 style="text-align:center; margin-bottom: 1rem;">Let's Create Something Special</h1>
    <p style="text-align:center; margin-bottom: 3rem;">Fill out the form below with your custom request, and we'll get back to you with a quote and timeline.</p>
    
    <div id="form-success" style="display:none; text-align:center; padding: 3rem; background: var(--white); border-radius: var(--radius);">
      <h2 class="accent-text" style="font-size: 2rem;">Request Sent!</h2>
      <p style="margin: 1rem 0;">We have received your custom order request. We'll review it and reach out shortly.</p>
      <button id="continue-wa" class="btn btn-primary" style="background:#25D366;">Continue chat on WhatsApp</button>
    </div>

    <form id="custom-form" style="background: var(--white); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow);">
      <input type="text" name="honeypot" class="honeypot" tabindex="-1" autocomplete="off">
      
      <div class="form-group">
        <label>Name *</label>
        <input type="text" name="name" required>
      </div>
      <div class="form-group">
        <label>WhatsApp Number *</label>
        <input type="tel" name="whatsapp" placeholder="+91" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email">
      </div>
      <div class="form-group">
        <label>Type of Order *</label>
        <select name="orderType" required>
          <option value="">Select...</option>
          <option value="Crochet">Crochet Item</option>
          <option value="Hamper">Gift Hamper</option>
          <option value="KidsWear">Kids Wear</option>
          <option value="WomensAccessories">Women's Accessories</option>
          <option value="TShirt">Custom T-Shirt Printing (Waitlist)</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description of your request *</label>
        <textarea name="description" rows="5" required placeholder="Colours, sizes, themes..."></textarea>
      </div>
      <div style="display:flex; gap:1rem;">
        <div class="form-group" style="flex:1;">
          <label>Quantity</label>
          <input type="number" name="quantity" min="1" value="1">
        </div>
        <div class="form-group" style="flex:1;">
          <label>Needed by Date</label>
          <input type="date" name="neededBy">
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
    </form>
  </main>
  
  <!-- (Include Footer) -->
  <script src="app.js" defer></script>
</body>
</html>
