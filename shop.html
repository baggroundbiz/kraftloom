<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shop | Kraftloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div id="global-toast" class="toast"></div>
  <div class="overlay" id="overlay"></div>
  
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 style="font-family:'Playfair Display', serif;">Your Cart</h3>
      <button id="close-cart" style="background:none;border:none;font-size:2rem;cursor:pointer;line-height:1;color:var(--brown);">&times;</button>
    </div>
    <div class="cart-items hide-scroll" id="cart-items-container"></div>
    <div class="cart-footer">
      <h3 id="cart-total" style="margin-bottom:1rem; font-family:'Playfair Display', serif;">Total: ₹0</h3>
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-primary" id="checkout-wa" style="flex: 1; font-size: 0.95rem; background: #25D366; color: white; border: none;">WhatsApp</button>
        <button class="btn btn-primary" id="checkout-ig" style="flex: 1; font-size: 0.95rem; background: linear-gradient(45deg, #f09433, #bc1888); color: white; border: none;">Instagram</button>
      </div>
    </div>
  </div>

  <header>
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="Kraftloom Logo">
      Kraftloom
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html" style="color:var(--rose); font-weight:700;">Shop All</a>
      <a href="custom-order.html">Custom Orders</a>
      <a href="about.html">About Us</a>
    </nav>
    <div class="nav-actions">
      <button class="open-cart-btn" style="background:none;border:none;cursor:pointer;position:relative;display:flex;align-items:center;">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span class="cart-badge">0</span>
      </button>
    </div>
  </header>
  
  <main class="container">
    <h1 style="margin-bottom: 1rem; text-align: center;">Shop Collection</h1>
    
    <div class="mobile-filter-toggle">
      <button id="toggle-filters-btn" class="btn btn-outline" style="width:100%; display:flex; align-items:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        Filter & Sort
      </button>
    </div>

    <div class="shop-layout">
      
      <aside class="filters" id="filters-sidebar">
        <div id="filter-form">
          <div class="form-group">
            <input type="text" id="filter-q" placeholder="Search products...">
          </div>
          
          <div class="form-group">
            <label style="margin-bottom: 0.8rem; font-family:'Playfair Display', serif; font-size:1.2rem;">Category</label>
            <label class="filter-label"><input type="radio" name="category" value="" class="custom-radio" checked> All Categories</label>
            <label class="filter-label"><input type="radio" name="category" value="Crochet" class="custom-radio"> Crochet</label>
            <label class="filter-label"><input type="radio" name="category" value="Gifts" class="custom-radio"> Gift Hampers</label>
            <label class="filter-label"><input type="radio" name="category" value="Womens Accessories" class="custom-radio"> Women's Accessories</label>
            <label class="filter-label"><input type="radio" name="category" value="Kids Wear" class="custom-radio"> Kids Wear</label>
          </div>
          
          <div class="form-group">
            <label style="margin-bottom: 0.8rem; font-family:'Playfair Display', serif; font-size:1.2rem;">Sort By</label>
            <label class="filter-label"><input type="radio" name="sort" value="newest" class="custom-radio" checked> Newest First</label>
            <label class="filter-label"><input type="radio" name="sort" value="price-asc" class="custom-radio"> Price: Low to High</label>
            <label class="filter-label"><input type="radio" name="sort" value="price-desc" class="custom-radio"> Price: High to Low</label>
          </div>
        </div>
      </aside>

      <section>
        <div class="grid grid-3" id="product-grid">
           <div class="skeleton" style="height:250px;"></div>
           <div class="skeleton" style="height:250px;"></div>
        </div>
      </section>
    </div>
  </main>
  
  <a href="https://wa.me/919876543210" class="floating-wa" target="_blank" aria-label="Chat on WhatsApp">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </a>

  <nav class="bottom-nav">
    <a href="index.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Home</span>
    </a>
    <a href="shop.html" class="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      <span>Shop</span>
    </a>
    <a href="custom-order.html">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      <span>Custom</span>
    </a>
    <a href="#" class="open-cart-btn">
      <span style="position:relative; display:flex;">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
        <span class="cart-badge">0</span>
      </span>
      <span>Cart</span>
    </a>
  </nav>

  <script src="app.js" defer></script>
</body>
</html>
