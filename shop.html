<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | Kraftloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Global Toast -->
  <div id="global-toast" class="toast"></div>
  
  <!-- Cart overlay/drawer -->
  <div class="overlay" id="overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button id="close-cart" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">&times;</button>
    </div>
    <div class="cart-items" id="cart-items-container"></div>
    <div class="cart-footer">
      <h3 id="cart-total" style="margin-bottom:1rem;">Total: ₹0</h3>
      <button class="btn btn-primary" id="checkout-wa" style="width:100%;">Order via WhatsApp</button>
    </div>
  </div>

  <header>
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="Kraftloom Logo">
      Kraftloom
    </a>
    <button class="hamburger">☰</button>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop All</a>
      <a href="custom-order.html">Custom Orders</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <button id="cart-btn" style="background:none;border:none;cursor:pointer;font-size:1.2rem;position:relative;">
        🛒 <span id="cart-count" style="position:absolute;top:-10px;right:-10px;background:var(--rose);color:white;border-radius:50%;width:20px;height:20px;font-size:0.8rem;display:flex;align-items:center;justify-content:center;">0</span>
      </button>
    </div>
  </header>
  
  <main class="container">
    <h1>Shop Collection</h1>
    <div class="shop-layout">
      <!-- Filters Sidebar: Now uses Instant Radio Buttons -->
      <aside class="filters" id="filters-sidebar">
        <div id="filter-form">
          <div class="filter-group">
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Search</label>
            <input type="text" id="filter-q" placeholder="Search products...">
          </div>
          <div class="filter-group">
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Category</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="category" value="" checked> All Categories</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="category" value="Crochet"> Crochet</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="category" value="Gifts"> Gift Hampers</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="category" value="Womens Accessories"> Women's Accessories</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="category" value="Kids Wear"> Kids Wear</label>
          </div>
          <div class="filter-group">
            <label style="font-weight: 600; display: block; margin-bottom: 0.5rem;">Sort By</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="sort" value="newest" checked> Newest First</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="sort" value="price-asc"> Price: Low to High</label>
            <label style="display: block; margin-bottom: 0.5rem; cursor: pointer;"><input type="radio" name="sort" value="price-desc"> Price: High to Low</label>
          </div>
        </div>
      </aside>

      <!-- Product Grid -->
      <section>
        <div class="grid grid-3" id="product-grid">
           <!-- Skeletons loaded via JS, replaced by data -->
           <div class="skeleton" style="height:350px;"></div>
           <div class="skeleton" style="height:350px;"></div>
           <div class="skeleton" style="height:350px;"></div>
        </div>
      </section>
    </div>
  </main>
  
  <a href="https://wa.me/919876543210" class="floating-wa" target="_blank" aria-label="Chat on WhatsApp">💬</a>

  <footer>
    <div class="logo" style="justify-content:center; margin-bottom:1rem;">
      <img src="assets/logo.png" alt="Kraftloom">
    </div>
    <p>27th Main Rd, nearby HSR Ceramics, 1st Sector, HSR Layout, Bengaluru 560102</p>
    <div class="footer-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="policies.html">Policies</a>
      <a href="contact.html">Contact</a>
    </div>
    <p>&copy; 2026 Kraftloom. All rights reserved.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
