<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product | Kraftloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Global Toast -->
  <div id="global-toast" class="toast"></div>
  
  <!-- Cart overlay/drawer -->
  <div class="overlay" id="overlay"></div>
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button id="close-cart" style="background:none;border:none;font-size:1.5rem;cursor:pointer;">&times;</button>
    </div>
    <div class="cart-items" id="cart-items-container"></div>
    <div class="cart-footer">
      <h3 id="cart-total" style="margin-bottom:1rem;">Total: ₹0</h3>
      <button class="btn btn-primary" id="checkout-wa" style="width:100%;">Order via WhatsApp</button>
    </div>
  </div>

  <header>
    <a href="index.html" class="logo">
      <img src="assets/logo.png" alt="Kraftloom Logo">
      Kraftloom
    </a>
    <button class="hamburger">☰</button>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop All</a>
      <a href="custom-order.html">Custom Orders</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <button id="cart-btn" style="background:none;border:none;cursor:pointer;font-size:1.2rem;position:relative;">
        🛒 <span id="cart-count" style="position:absolute;top:-10px;right:-10px;background:var(--rose);color:white;border-radius:50%;width:20px;height:20px;font-size:0.8rem;display:flex;align-items:center;justify-content:center;">0</span>
      </button>
    </div>
  </header>
  
  <main class="container">
    <div id="breadcrumb" style="margin-bottom: 2rem; font-size: 0.9rem; color: #666;"></div>
    
    <div class="product-single">
      <!-- Image Gallery -->
      <div>
        <img id="main-img" class="gallery-main skeleton" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="Loading">
      </div>
      
      <!-- Details -->
      <div class="product-info">
        <span id="p-status" class="stock-status skeleton" style="min-width: 80px;"></span>
        <h1 id="p-name" class="skeleton" style="min-height: 40px; margin-bottom:1rem;"></h1>
        <h2 id="p-price" class="price skeleton" style="font-size: 1.5rem; min-height: 30px;"></h2>
        <p id="p-desc" class="skeleton" style="margin: 1.5rem 0; min-height: 100px;"></p>
        
        <div class="order-actions">
          <button id="btn-cart" class="btn btn-outline">Add to Cart</button>
          <button id="btn-wa" class="btn btn-primary" style="background:#25D366; color:white;">Order on WhatsApp</button>
          <button id="btn-ig" class="btn btn-primary" style="background:linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);">Order on Instagram</button>
        </div>
      </div>
    </div>
  </main>
  
  <a href="https://wa.me/919876543210" class="floating-wa" target="_blank" aria-label="Chat on WhatsApp">💬</a>

  <footer>
    <div class="logo" style="justify-content:center; margin-bottom:1rem;">
      <img src="assets/logo.png" alt="Kraftloom">
    </div>
    <p>27th Main Rd, nearby HSR Ceramics, 1st Sector, HSR Layout, Bengaluru 560102</p>
    <div class="footer-links">
      <a href="shop.html">Shop</a>
      <a href="about.html">About</a>
      <a href="policies.html">Policies</a>
      <a href="contact.html">Contact</a>
    </div>
    <p>&copy; 2026 Kraftloom. All rights reserved.</p>
  </footer>
  
  <script src="app.js" defer></script>
</body>
</html>
