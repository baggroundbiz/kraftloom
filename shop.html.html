<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | Kraftloom</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Nunito:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- (Include identical header, toast, cart, and floating WA button here) -->
  
  <main class="container">
    <h1>Shop Collection</h1>
    <div class="shop-layout">
      <!-- Filters Sidebar -->
      <aside class="filters" id="filters-sidebar">
        <form id="filter-form" action="shop.html" method="GET">
          <div class="filter-group">
            <label>Search</label>
            <input type="text" name="q" placeholder="Search products...">
          </div>
          <div class="filter-group">
            <label>Category</label>
            <select name="category">
              <option value="">All Categories</option>
              <option value="Crochet">Crochet</option>
              <option value="Gifts">Gift Hampers</option>
              <option value="Womens Accessories">Women's Accessories</option>
              <option value="Kids Wear">Kids Wear</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Sort By</label>
            <select name="sort">
              <option value="newest">Newest First</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
          <button type="submit" class="btn btn-outline" style="width:100%">Apply Filters</button>
        </form>
      </aside>

      <!-- Product Grid -->
      <section>
        <div class="grid grid-3" id="product-grid">
           <!-- Skeletons loaded via JS, replaced by data -->
           <div class="skeleton" style="height:350px;"></div>
           <div class="skeleton" style="height:350px;"></div>
           <div class="skeleton" style="height:350px;"></div>
        </div>
      </section>
    </div>
  </main>
  
  <!-- (Include Footer here) -->
  <script src="app.js" defer></script>
</body>
</html>
